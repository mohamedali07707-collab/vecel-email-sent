<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
        <h1>🎉 اختبار الرفع على Vercel بنجاح</h1>
        <p>هذا الموقع يعمل بالكامل بـ Node.js كـ Serverless Function مجاناً!</p>
        
        <form id="contactForm">
            <input type="text" id="name" placeholder="اسمك الكريم" required>
            <input type="email" id="email" placeholder="بريدك الإلكتروني" required>
            <textarea id="message" placeholder="اكتب رسالتك هنا..." rows="5" required></textarea>
            <button type="submit">إرسال الرسالة فوراً</button>
        </form>
        <p id="responseMessage"></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
